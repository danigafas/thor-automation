---
- name: Recuperar informes THOR desde Windows
  hosts: windows
  gather_facts: false

  vars:
    thor_remote_results: "{{ thor_results_base_dir }}"
    thor_local_results: '{{ thor_project_dir }}/results/raw'

    thor_report_files:
      - thor.json
      - thor.html
      - thor.txt

  tasks:

    - name: Comprobar identificador de ejecucion
      ansible.builtin.assert:
        that:
          - hostvars['localhost'].thor_global_run_id is defined
        fail_msg: >-
          No existe un identificador global de ejecucion.
          Ejecuta la recogida mediante site.yml.

    - name: Establecer identificador y directorio local
      ansible.builtin.set_fact:
        thor_run_id: "{{ hostvars['localhost'].thor_global_run_id }}"
        thor_local_dir: >-
          {{ thor_local_results }}/{{ inventory_hostname }}/{{ hostvars['localhost'].thor_global_run_id }}

    - name: Mostrar analisis seleccionado
      ansible.builtin.debug:
        msg: "Recuperando analisis {{ thor_run_id }} de {{ inventory_hostname }}"

    - name: Crear directorio local
      ansible.builtin.file:
        path: "{{ thor_local_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost

    - name: Descargar informes
      ansible.builtin.fetch:
        src: "{{ thor_remote_results }}\\{{ thor_run_id }}\\{{ item }}"
        dest: "{{ thor_local_dir }}/{{ item }}"
        flat: true
        validate_checksum: true
      loop: "{{ thor_report_files }}"
      no_log: true

    - name: Proteger permisos de los informes
      ansible.builtin.file:
        path: "{{ thor_local_dir }}/{{ item }}"
        mode: '0600'
      loop: "{{ thor_report_files }}"
      delegate_to: localhost

    - name: Generar manifiesto de resultados
      ansible.builtin.command:
        argv:
          - python3
          - "{{ thor_project_dir }}/scripts/create_manifest.py"
          - --host
          - "{{ inventory_hostname }}"
          - --run-id
          - "{{ thor_run_id }}"
          - --results-dir
          - "{{ thor_local_dir }}"
      delegate_to: localhost
      changed_when: true

    - name: Registrar recuperacion correcta
      ansible.builtin.copy:
        content: |
          {{
            {
              'host': inventory_hostname,
              'run_id': thor_run_id,
              'status': 'collected',
              'timestamp': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')
            } | to_nice_json
          }}
        dest: "{{ thor_project_dir }}/logs/runs/{{ thor_run_id }}/hosts/{{ inventory_hostname }}.json"
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: Confirmar recuperacion
      ansible.builtin.debug:
        msg: "Informes recuperados en {{ thor_local_dir }}"
